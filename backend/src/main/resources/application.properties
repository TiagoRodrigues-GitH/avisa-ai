spring.application.name=avisa-ai
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Banco: arquivo H2 local por padrão (gratuito, sem instalar nada). Para PostgreSQL, defina DATABASE_URL etc.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/avisaai;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Usuário do sistema (gere o hash com scripts/bcrypt-hash.ps1)
app.username=${APP_USERNAME:admin}
app.password-hash=${APP_PASSWORD_HASH:}
app.cors-origins=${CORS_ORIGINS:http://localhost:4200}

# Regras de envio
app.zone=${APP_ZONE:America/Sao_Paulo}
app.send-from=${APP_SEND_FROM:08:00}
app.send-until=${APP_SEND_UNTIL:20:00}
app.release-every-ms=60000
# Cria clientes e compromissos de exemplo quando o banco está vazio
app.demo-data=${APP_DEMO_DATA:true}

# App Angular compilado (npm run build em ../frontend); assim o mesmo endereço serve app e API
spring.web.resources.static-locations=classpath:/static/,${APP_FRONTEND_DIR:file:../frontend/dist/frontend/browser/}

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
